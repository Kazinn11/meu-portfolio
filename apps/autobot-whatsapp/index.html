<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | WhatsApp AutoBot</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wa: {
                            bg: '#111b21',       /* Fundo Chat App */
                            panel: '#202c33',    /* Barra Esquerda Contact List */
                            bar: '#202c33',      /* Header Fundo */
                            green: '#00a884',    /* Botão Primary Zap */
                            greenHover:'#008f6f',
                            msgOut: '#005c4b',   /* Mensagem Enviada Bot */
                            msgIn: '#202c33',    /* Mensagem do Cliente */
                            text: '#e9edef',     /* Branco Acinzentado */
                            muted: '#8696a0'     /* Cinza Secundário */
                        }
                    },
                    fontFamily: { sans: ['Segoe UI', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #111b21; color: #e9edef; overflow: hidden; }
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        .qr-scan { animation: scanLine 2s linear infinite; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scanLine { 0% { top: 0; } 100% { top: 100%; } }
        .hide-scroll::-webkit-scrollbar { width: 5px; }
        .hide-scroll::-webkit-scrollbar-thumb { background: #374045; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
const { useState, useEffect, useRef } = React;

// ==== ÍCONES ====
const IconRobot = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/><path d="M12 3v5"/><path d="M12 3a2 2 0 0 0-2-2"/><path d="M12 3a2 2 0 0 1 2-2"/></svg>;
const IconCheckDouble = ({ color }) => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={color} stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>;
const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;

// ==== TELAS MOCKERS APP ====
const App = () => {
    // ESTADOS: Auth (QR) -> Painel (Chat Lógico) -> Config
    const [view, setView] = useState('auth'); 
    
    // Lista de Threads Falsas do Painel Administrativo
    const [activeChatId, setActiveChatId] = useState(1);
    
    // Chat do Cliente Suporte sendo Injetado dinamicamente para fingir que alguem mandou mensagem e a API do Node respondeu
    const [messages, setMessages] = useState([
        { id: 1, text: "Olá! Acabei de ligar meu computador pós-formatação e preciso de links.", out: false, time: "18:24", status: 'read' },
    ]);

    // Tela de Auth Delay (Tempo falso escaneando o celular)
    useEffect(() => {
        if (view === 'auth') {
            const tmr = setTimeout(() => setView('chat'), 5000); // 5 seg lendo QR e entra
            return () => clearTimeout(tmr);
        }
    }, [view]);

    // Simulação do Robô NodeJS Baileys Operando ao Vivo na Dashboard!
    useEffect(() => {
        if (view === 'chat' && messages.length === 1) {
            // Cliente Mandou a MSG Inicial "Ola acabei de ligar..."
            // BOT RESPONDE (Delay de Rede Simulado)
            setTimeout(() => {
                setMessages(prev => [...prev, {
                    id: 2, 
                    text: "🤖 *Olá! Eu sou o AutoBot de Atendimento.*\nComo posso te ajudar hoje? Digite o NÚMERO:\n\n*1.* 🛠️ Suporte Técnico Win/Mac\n*2.* 💳 Financeiro\n*3.* 👤 Falar com Humano",
                    out: true, time: "18:24", status: 'sent'
                }]);
            }, 1500);

            // Altera mensagem para Read
            setTimeout(() => {
                 setMessages(prev => {
                     const copy = [...prev];
                     copy[1].status = 'read';
                     return copy;
                 });
            }, 3000);

             // Cliente aperta "1"
             setTimeout(() => {
                 setMessages(prev => [...prev, {
                     id: 3, text: "1", out: false, time: "18:25", status: 'read'
                 }]);
             }, 5500);

             // Bot entrega Menu 1 (O Switch/Case Real lá do Node)
             setTimeout(() => {
                 setMessages(prev => [...prev, {
                     id: 4, 
                     text: "🛠️ O Suporte de T.I atende de segunda a sexta.\nAqui estão as Ferramentas Essenciais do seu pacote: \nwww.suporte.corp/v/tools",
                     out: true, time: "18:25", status: 'sent'
                 }]);
             }, 6800);
        }
    }, [view, messages]);


    // TELA 1: AUTENTICAÇÃO QR CODE
    if (view === 'auth') {
        return (
            <div className="h-screen w-full flex flex-col items-center justify-center bg-[#222e35] relative">
                <div className="absolute top-0 w-full h-[222px] bg-wa-green"></div>
                
                <div className="z-10 bg-white rounded-lg shadow-2xl p-10 flex flex-col md:flex-row gap-16 max-w-4xl fade-in mt-14">
                     <div className="flex-1 text-[#41525d]">
                          <h1 className="text-3xl font-light mb-8 text-[#111b21]">Use o AutoBot Mocker</h1>
                          <ol className="list-decimal pl-5 space-y-4 text-lg">
                              <li>Abra o WhatsApp no seu telefone</li>
                              <li>Toque em <span className="font-bold">Mais opções ⋮</span> ou <span className="font-bold">Configurações ⚙️</span></li>
                              <li>Toque em <span className="font-bold">Aparelhos conectados</span></li>
                              <li>Mire aqui conectando o Terminal Socket.</li>
                          </ol>
                          <p className="mt-8 text-wa-green font-bold text-sm tracking-widest animate-pulse">LENDO SERVIDOR BAILEYS_NODE...</p>
                     </div>
                     <div className="relative">
                          {/* Falso Quadradinho QR Code Carregando */}
                          <div className="w-64 h-64 bg-gray-100 border-4 border-gray-200 rounded-xl relative overflow-hidden flex items-center justify-center">
                              <div className="w-full absolute self-center border-t-2 border-wa-green opacity-50 qr-scan"></div>
                              <div className="grid grid-cols-4 grid-rows-4 gap-2 w-48 h-48 opacity-20">
                                   {[...Array(16)].map((_, i) => <div key={i} className={`bg-gray-800 rounded-sm ${i%3===0 ? 'opacity-10' : ''}`}></div>)}
                              </div>
                          </div>
                     </div>
                </div>
            </div>
        );
    }

    // TELA 2: DASHBOARD ADMIN DO ZAP (AUTENTICADO MULTI-DEVICE)
    return (
        <div className="h-screen w-full flex bg-wa-bg fade-in">
            
            {/* LADO ESQUERDO (Lista de Contatos/Atendimentos Frios) */}
            <aside className="w-1/3 min-w-[340px] max-w-[420px] bg-wa-panel flex flex-col border-r border-gray-700/40">
                {/* Header Meu Perfil */}
                <div className="h-16 bg-wa-bar flex items-center justify-between px-4 shrink-0 border-b border-gray-700/30">
                    <div className="flex items-center gap-3">
                         <div className="w-10 h-10 bg-wa-green text-wa-bg rounded-full flex items-center justify-center font-bold relative">
                              <IconRobot />
                              <div className="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-wa-bar"></div>
                         </div>
                         <p className="font-bold text-sm">Bot Node.js | +55119999-0000</p>
                    </div>
                </div>
                
                {/* Search Bar Falsa */}
                <div className="p-2 border-b border-gray-700/30">
                    <div className="bg-wa-bg rounded-lg h-9 flex items-center px-4">
                         <span className="text-gray-500 text-sm">🔎 Search or start new AI Chat</span>
                    </div>
                </div>

                {/* Lista ChatRooms */}
                <div className="flex-1 overflow-y-auto hide-scroll pb-10">
                     
                     {/* Chat Ativo 1 (O Que tem a animação ocorrendo) */}
                     <div onClick={() => setActiveChatId(1)} className={`h-18 flex items-center px-3 py-3 cursor-pointer hover:bg-gray-800/40 border-b border-gray-700/20 ${activeChatId===1 ? 'bg-gray-800/60' : ''}`}>
                         <img src="https://ui-avatars.com/api/?name=Cliente+Silva&background=8B5CF6&color=fff" className="w-12 h-12 rounded-full mr-3 shrink-0" />
                         <div className="flex-1 min-w-0">
                              <div className="flex justify-between items-center mb-1">
                                   <p className="text-sm font-light text-wa-text truncate">Cliente Empresa B2B</p>
                                   <p className="text-xs text-wa-green font-bold">18:25</p>
                              </div>
                              <div className="flex items-center text-xs text-wa-muted truncate">
                                   <IconCheckDouble color="#53bdeb" /><span className="ml-1 truncate">🛠️ O Suporte de T.I atende d...</span>
                              </div>
                         </div>
                     </div>

                     {/* Chat Morto Falso (Prova de Conceito de Lista) */}
                     <div onClick={() => setActiveChatId(2)} className={`h-18 flex items-center px-3 py-3 cursor-pointer hover:bg-gray-800/40 border-b border-gray-700/20 ${activeChatId===2 ? 'bg-gray-800/60' : ''}`}>
                         <img src="https://ui-avatars.com/api/?name=Rafael+Admin&background=F59E0B&color=fff" className="w-12 h-12 rounded-full mr-3 shrink-0" />
                         <div className="flex-1 min-w-0">
                              <div className="flex justify-between items-center mb-1">
                                   <p className="text-sm font-light text-wa-text truncate">Suporte Analista (Mudo)</p>
                                   <p className="text-xs text-wa-muted">Ontem</p>
                              </div>
                              <div className="flex items-center text-xs text-wa-muted truncate">
                                   O bot está de folga. Encontramos um Log de erro no NGINX da nuvem de produção.
                              </div>
                         </div>
                     </div>
                </div>
            </aside>


            {/* LADO DIREITO (AREA CENTRAL DO CHAT LOG) */}
            <main className="flex-1 bg-wa-bg flex flex-col relative w-full border-l border-gray-700/30 overflow-hidden">
                
                {/* Background Doodles Pattern (WhatsApp Wallpaper) Falso usando Opacidade */}
                <div className="absolute inset-0 opacity-[0.03] z-0 pointer-events-none" style={{ backgroundImage: 'radial-gradient(circle at 10px 10px, white 1px, transparent 0)', backgroundSize: '40px 40px' }}></div>

                {/* Header Dinâmico do Chat */}
                <header className="h-16 bg-wa-bar flex items-center px-4 shrink-0 z-10 shadow-sm justify-between">
                     <div className="flex items-center gap-3">
                          <img src="https://ui-avatars.com/api/?name=Cliente+Silva&background=8B5CF6&color=fff" className="w-10 h-10 rounded-full" />
                          <div>
                               <p className="font-bold text-sm text-wa-text">Cliente Empresa B2B</p>
                               <p className="text-xs text-wa-muted">Simulação Webhook Node / React.js</p>
                          </div>
                     </div>
                     <div className="text-wa-muted">
                          {/* Engrenagem da "Aba de Administrar Regras RegEx" */}
                          <IconSettings />
                     </div>
                </header>

                {/* Balões de Conversas Listados (Logs Virtuais Mocker) */}
                <div className="flex-1 overflow-y-auto px-16 py-8 z-10 hide-scroll flex flex-col">
                     
                     <div className="text-center mb-6">
                         <span className="bg-[#182229] px-4 py-1.5 rounded-lg text-xs font-bold text-wa-muted shadow-sm">Hoje</span>
                     </div>

                     {/* Loop das mensagens ativas do Chat 1 */}
                     {activeChatId === 1 ? messages.map(msg => (
                         <div key={msg.id} className={`max-w-[80%] md:max-w-md lg:max-w-lg rounded-lg px-3 py-2 text-[14.5px] mb-2 relative shadow-sm fade-in inline-block clear-both ${msg.out ? 'bg-wa-msgOut ml-auto text-wa-text rounded-tr-none' : 'bg-wa-msgIn mr-auto text-wa-text rounded-tl-none'}`} style={{ whiteSpace: 'pre-line' }}>
                             
                             <span className="leading-snug">{msg.text}</span>
                             
                             <div className="float-right mt-2 ml-4 flex items-center gap-1">
                                  <span className="text-[10px] text-gray-400 font-bold">{msg.time}</span>
                                  {msg.out && <IconCheckDouble color={msg.status === 'read' ? '#53bdeb' : '#8696a0'} />}
                             </div>
                         </div>
                     )) : (
                          <div className="text-center mt-20 text-wa-muted text-sm fade-in">Este chat não tem simulação de WebHook no Front-end.<br/>Volte para o Cliente 1 para rever os Logs!</div>
                     )}

                </div>

                {/* Caixa Footer (Digitar Msg Falsa - Para Mostrar que o Painel do Admin Também Responde) */}
                <footer className="h-16 bg-wa-bar flex items-center px-6 shrink-0 z-10 gap-4">
                     <div className="w-full bg-[#2a3942] rounded-lg h-10 flex items-center px-4 cursor-not-allowed">
                          <span className="text-wa-muted text-sm">O Bot Mestre está controlando esta sessão (Painel Somente Leitura)...</span>
                     </div>
                </footer>
            </main>
        
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
